<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUST Library - Dang ky doc gia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .auth-container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .auth-header h2 {
            color: #003366;
            margin: 0 0 5px 0;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #4a5568;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-register {
            width: 100%;
            padding: 12px;
            background-color: #2ecc71;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-register:hover {
            background-color: #27ae60;
        }
        .btn-register:disabled {
            background-color: #9ae6b4;
            cursor: not-allowed;
        }
        .auth-switch {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .auth-switch a {
            color: #2b6cb0;
            text-decoration: none;
            font-weight: bold;
        }
        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 4px;
            display: block;
            min-height: 15px;
        }
        .success-card {
            background: #edf7ed;
            color: #1e4620;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            border: 1px solid #c3e6cb;
            text-align: center;
        }
        .reader-id {
            font-size: 18px;
            font-weight: bold;
            color: #ff0000;
            margin-top: 5px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-header">
        <h2>DANG KY DOC GIA</h2>
        <p>He thong cap ma tu dong tu</p>
    </div>

    <div id="register-success" class="success-card hidden">
        Dang ky thanh cong! Ma doc gia cua ban la:
        <div class="reader-id" id="assigned-id"></div>
    </div>

    <form onsubmit="handleRegister(event)">
        <div class="form-group">
            <label>Ho va ten</label>
            <input type="text" id="reg-name" required placeholder="Nguyen Van A">
            <span class="error-message" id="name-error"></span>
        </div>
        <div class="form-group">
            <label>Dia chi Email</label>
            <input type="email" id="reg-email" required placeholder="anh.nv261234@gmail.com">
            <span class="error-message" id="email-error"></span>
        </div>
        <div class="form-group">
            <label>So dien thoai</label>
            <input type="tel" id="reg-phone" required placeholder="0912345678">
            <span class="error-message" id="phone-error"></span>
        </div>
        <div class="form-group">
            <label>Gioi tinh</label>
            <div style="display: flex; gap: 15px; align-items: center; margin-top: 4px;">
                <label style="display: inline-flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer;">
                    <input type="radio" name="reg-gender" value="Nam" checked> Nam
                </label>
                <label style="display: inline-flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer;">
                    <input type="radio" name="reg-gender" value="Nu"> Nu
                </label>
            </div>
        </div>
        <div class="form-group">
            <label>Tao mat khau</label>
            <input type="password" id="reg-password" required placeholder="Toi thieu 6 ky tu">
            <span class="error-message" id="password-error"></span>
        </div>
        <button type="submit" class="btn-register">Dang ky thong tin</button>
    </form>

    <div class="auth-switch">
        Da co tai khoan? <a href="login.html">Quay lai Dang nhap</a>
    </div>
</div>

<script src="../shared/api.js"></script>
<script src="register.js"></script>
</body>
</html>
