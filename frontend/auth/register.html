<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUST Library - Đăng ký độc giả</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .auth-container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .auth-header h2 {
            color: #003366;
            margin: 0 0 5px 0;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #4a5568;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
        }
        /* Nút Đăng ký màu Xanh lá theo ảnh mẫu */
        .btn-register {
            width: 100%;
            padding: 12px;
            background-color: #2ecc71; /* Màu xanh lá */
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-register:hover {
            background-color: #27ae60;
        }
        .auth-switch {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .auth-switch a {
            color: #2b6cb0;
            text-decoration: none;
            font-weight: bold;
        }
        .success-card {
            background: #edf7ed;
            color: #1e4620;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            border: 1px solid #c3e6cb;
            text-align: center;
        }
        .reader-id {
            font-size: 18px;
            font-weight: bold;
            color: #ff0000;
            margin-top: 5px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-header">
        <h2>ĐĂNG KÝ ĐỘC GIẢ</h2>
        <p>Hệ thống cấp mã tự động lần đầu</p>
    </div>

    <div id="register-success" class="success-card hidden">
        Đăng ký thành công! Mã độc giả của bạn là:
        <div class="reader-id" id="assigned-id"></div>
    </div>
    
    <form onsubmit="handleRegister(event)">
        <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" required placeholder="Nguyễn Văn A">
        </div>
        <div class="form-group">
            <label>Địa chỉ Email</label>com
            <input type="email" required placeholder="anh.nv261234@gmail.com">
        </div>
        <div class="form-group">
            <label>Số điện thoại</label>
            <input type="tel" required placeholder="0912345678">
        </div>
        <div class="form-group">
            <label>Tạo mật khẩu</label>
            <input type="password" required placeholder="Tối thiểu 6 ký tự">
        </div>
        <button type="submit" class="btn-register">Đăng ký thông tin</button>
    </form>
    
    <div class="auth-switch">
        Đã có tài khoản? <a href="login.html">Quay lại Đăng nhập</a>
    </div>
</div>

<script>
    function handleRegister(event) {
        event.preventDefault();
        const randomNumbers = Math.floor(1000 + Math.random() * 9000);
        const readerId = "VN" + randomNumbers;N

        document.getElementById('assigned-id').innerText = readerId;
        document.getElementById('register-success').classList.remove('hidden');

        alert(`Đăng ký thành công!\nMã độc giả cấp mới: ${readerId}`);
    }
</script>
</body>
</html>
