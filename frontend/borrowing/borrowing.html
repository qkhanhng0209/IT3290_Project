<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mượn sách</title>
    <link rel="stylesheet" href="../shared/base.css">
</head>
<body>

<div class="app-shell">

    <header class="topbar">
        <div class="brand">
            📚 Quản lý thư viện
        </div>

        <nav class="nav-links">
            <a class="active" href="./borrowing.html">
                Mượn sách
            </a>

            <a href="../returns/returns.html">
                Trả sách
            </a>
        </nav>
    </header>

    <main class="page">

        <section class="page-header">
            <div class="page-title">
                <h1>📚 Mượn sách</h1>
                <p>
                    Đặt trước sách và xác nhận nhận sách tại quầy.
                </p>
            </div>
        </section>

        <section class="grid">

            <!-- BÊN TRÁI -->
            <div class="stack">

                <!-- ĐẶT TRƯỚC -->
                <section class="panel">

                    <h2>📝 Đặt trước sách</h2>

                    <form id="reserveForm" class="form-grid">

                        <div class="field">
                            <label>Mã độc giả</label>
                            <input
                                id="readerId"
                                type="number"
                                min="1"
                                required>
                        </div>

                        <div class="field">
                            <label>Số ngày mượn</label>
                            <input
                                id="borrowDays"
                                type="number"
                                min="1"
                                value="14">
                        </div>

                        <div class="field full">
                            <label>ISBN</label>
                            <input
                                id="isbn"
                                type="text"
                                placeholder="978604xxxx">
                        </div>

                        <div class="field">
                            <label>Số lượng</label>
                            <input
                                id="quantity"
                                type="number"
                                min="1"
                                value="1">
                        </div>

                        <div class="actions field full">

                            <button
                                type="button"
                                id="addBookBtn">
                                Thêm sách
                            </button>

                            <button
                                type="submit">
                                Đặt trước
                            </button>

                        </div>

                    </form>

                    <div id="borrowItems"></div>

                    <div
                        id="reserveMessage"
                        class="message"
                        hidden>
                    </div>

                </section>

                <!-- XÁC NHẬN LẤY -->
                <section class="panel">

                    <h2>✅ Xác nhận lấy sách</h2>

                    <form id="pickupForm" class="form-grid">

                        <div class="field">
                            <label>Mã phiếu mượn</label>
                            <input
                                id="borrowTicketId"
                                type="number"
                                min="1"
                                required>
                        </div>

                        <div class="field">
                            <label>Mã nhân viên</label>
                            <input
                                id="staffId"
                                type="number"
                                min="1"
                                required>
                        </div>

                        <div class="actions field full">
                            <button type="submit">
                                Xác nhận lấy sách
                            </button>
                        </div>

                    </form>

                    <div
                        id="pickupMessage"
                        class="message"
                        hidden>
                    </div>

                </section>

            </div>

            <!-- BÊN PHẢI -->
            <aside class="stack">

                <section class="panel">

                    <h2>📋 Thông tin phiếu mượn</h2>

                    <div class="summary-cards">

                        <div class="summary-card">
                            <span>Mã phiếu</span>
                            <strong id="borrowTicket">
                                -
                            </strong>
                        </div>

                        <div class="summary-card">
                            <span>Trạng thái</span>
                            <strong id="borrowStatus">
                                -
                            </strong>
                        </div>

                        <div class="summary-card">
                            <span>Hạn giữ sách</span>
                            <strong id="holdUntil">
                                -
                            </strong>
                        </div>

                    </div>

                </section>

                <section class="panel">

                    <h2>📚 Danh sách sách</h2>

                    <div class="table-wrap">

                        <table>

                            <thead>
                                <tr>
                                    <th>Mã sách</th>
                                    <th>ISBN</th>
                                    <th>Tên sách</th>
                                    <th>Hạn trả</th>
                                </tr>
                            </thead>

                            <tbody id="borrowResultTable">

                                <tr>
                                    <td colspan="4">
                                        Chưa có dữ liệu
                                    </td>
                                </tr>

                            </tbody>

                        </table>

                    </div>

                </section>

            </aside>

        </section>

    </main>

</div>

<script src="../shared/api.js"></script>
<script src="./borrowing.js"></script>

</body>
</html>
