<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trả sách</title>
    <link rel="stylesheet" href="../shared/base.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand">Quản lý thư viện</div>

            <nav class="nav-links" aria-label="Chức năng">
                <a href="../borrowing/borrowing.html">Mượn sách</a>
                <a class="active" href="./returns.html">Trả sách</a>
            </nav>
        </header>

        <main class="page">
            <section class="page-header">
                <div class="page-title">
                    <h1>Trả sách</h1>
                    <p>
                        Ghi nhận trả từng cuốn sách, tính tiền phạt và cập nhật tình trạng kho.
                    </p>
                </div>
            </section>

            <section class="grid">
                <div class="stack">

                    <section class="panel">
                        <h2>Tra cứu phiếu mượn</h2>

                        <form id="lookupForm" class="form-grid">
                            <div class="field">
                                <label for="ticketId">Mã phiếu mượn</label>
                                <input
                                    id="ticketId"
                                    type="number"
                                    min="1"
                                    required>
                            </div>

                            <div class="field">
                                <label for="returnStaffId">Mã nhân viên</label>
                                <input
                                    id="returnStaffId"
                                    type="number"
                                    min="1"
                                    required>
                            </div>

                            <div class="actions field full">
                                <button type="submit">
                                    Tải danh sách sách chưa trả
                                </button>
                            </div>

                            <div
                                id="lookupMessage"
                                class="message field full"
                                hidden>
                            </div>
                        </form>
                    </section>

                    <section class="panel">
                        <div style="
                            display:flex;
                            justify-content:space-between;
                            align-items:center;
                            margin-bottom:12px;
                        ">
                            <h2 style="margin:0">
                                Danh sách sách trả
                            </h2>

                            <span id="returnBookCount" class="status">
                                0 cuốn
                            </span>
                        </div>

                        <form id="returnForm">
                            <div id="returnItems"></div>

                            <div class="actions">
                                <button type="submit">
                                    Ghi nhận trả sách
                                </button>
                            </div>

                            <div
                                id="returnMessage"
                                class="message"
                                hidden>
                            </div>
                        </form>
                    </section>
                </div>

                <aside class="stack">

                    <section class="panel">
                        <h2>Kết quả xử lý</h2>

                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Mã sách</th>
                                        <th>Tên sách</th>
                                        <th>Ngày trễ</th>
                                        <th>Tình trạng</th>
                                        <th>Tiền phạt</th>
                                    </tr>
                                </thead>

                                <tbody id="returnResultTable">
                                    <tr>
                                        <td colspan="5" class="empty-state">
                                            Chưa có dữ liệu trả sách
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>

                    <section class="panel">
                        <h2>Tổng kết</h2>

                        <div class="field">
                            <label>Tổng tiền phạt</label>
                            <div id="totalFine" class="status">
                                0 VNĐ
                            </div>
                        </div>

                        <br>

                        <div class="field">
                            <label>Trạng thái phiếu</label>
                            <div id="ticketStatus" class="status">
                                -
                            </div>
                        </div>
                    </section>

                </aside>
            </section>
        </main>
    </div>

    <script src="../shared/api.js"></script>
    <script src="./returns.js"></script>
</body>
</html>
